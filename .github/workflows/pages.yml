name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub 的 artifact 列表接口在上传成功后还会延迟一两秒才可见，而
      # deploy-pages 只查一次。等一会儿比一次失败的部署便宜。
      - name: Wait for the artifact to be indexed
        run: sleep 15

      - id: deployment
        uses: actions/deploy-pages@v4
