# 把 Playground 的 Beta 通道同步到 Loment 的最新 main。
#
# Beta 的定义就是"最新 main 上的参考编译器"；手拷一份会在别人改完编译器后悄悄变旧，
# 所以这条每天跑一次，也可以在 Actions 里手动触发。只有 playground/beta 变了才提交。
name: beta-sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Loment-Lang/loment
          ref: main
          path: _loment
      - name: Copy the compiler into playground/beta
        run: python3 tools/sync_beta.py _loment
      - name: Commit if anything changed
        run: |
          git config user.name "loment-bot"
          git config user.email "bot@loment-lang.github.io"
          git add playground/beta
          if git diff --cached --quiet; then
            echo "beta is already current"
            exit 0
          fi
          git commit -m "playground: 同步 Beta 到 Loment main"
          git push
